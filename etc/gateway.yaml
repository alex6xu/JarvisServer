Name: gateway
Host: 127.0.0.1
Port: 8080
Timeout: 0
Mode: dev
Log:
  ServiceName: jarvis-gateway
  Mode: file
  Encoding: json
  Path: ./data/logs
  Level: info
  Rotation: size
  MaxSize: 50
  MaxBackups: 10
  KeepDays: 7
  Compress: true

DistributedLog:
  ServiceName: jarvis-gateway
  Environment: development
  # InstanceID: "" # or set JARVIS_INSTANCE_ID; defaults to hostname-pid

# Disable default request timeout middleware so SSE / long polls are not cut.
Middlewares:
  Timeout: false

Agent:
  Approve: false
  AuthMode: token
  AllowRegistration: false
  AuditRetentionDays: 30
  AuditMaxBodyBytes: 1048576
  RunTimeoutSeconds: 1800
  WorkspaceUploadMaxBytes: 104857600
  WorkspaceMaxBytes: 104857600
  WorkspaceMaxFileBytes: 10485760
  AllowPrivateProviderURLs: false
  # Cwd: .
  # BaseURL: ""
  # Protocol: ""
  # ProviderName: ""
  # APIKey: ""
  # ThinkingLevel: ""
  # NoTools: false
  # NoSkills: false
  # WorkspacesRoot: ./workspaces
  # DatabasePath: ./.jarvis/gateway.db
  # APIToken: ""
  # AdminPassword: "" # or set JARVIS_ADMIN_PASSWORD

# Optional GitHub OAuth. Users can also connect a fine-grained PAT from Settings.
GitHub:
  # ClientID: "" # or GITHUB_CLIENT_ID
  # ClientSecret: "" # or GITHUB_CLIENT_SECRET
  # RedirectURL: "https://your-domain.example/v1/github/callback"
  # TokenKey: "" # or GITHUB_TOKEN_KEY; empty generates .jarvis/github-token.key
  # Scopes: "repo read:user"
  # APIBaseURL: "https://api.github.com"
  # WebBaseURL: "https://github.com"
  GitTimeoutSecs: 300
