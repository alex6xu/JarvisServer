Name: gateway
Host: 127.0.0.1
Port: 8080
Timeout: 0
Mode: dev
Log:
  ServiceName: jarvis-gateway
  Mode: file
  Encoding: json
  Path: ./data/logs
  Level: info
  Rotation: size
  MaxSize: 50
  MaxBackups: 10
  KeepDays: 7
  Compress: true

DistributedLog:
  ServiceName: jarvis-gateway
  Environment: development
  # InstanceID: "" # or set JARVIS_INSTANCE_ID; defaults to hostname-pid

# SSE/long polls must not time out. Global CPU shedding is disabled because
# Coder child processes can otherwise reject unrelated Chat and recovery calls.
# The project request logger is used so credentials are never dumped.
Middlewares:
  Timeout: false
  Shedding: false
  Log: false

Agent:
  Approve: false
  AuthMode: token
  AllowRegistration: false
  AuditRetentionDays: 30
  AuditMaxBodyBytes: 1048576
  RunTimeoutSeconds: 1800
  WorkspaceUploadMaxBytes: 104857600
  WorkspaceMaxBytes: 104857600
  WorkspaceMaxFileBytes: 10485760
  AllowPrivateProviderURLs: false
  AllowPrivateNotificationURLs: false
  # Cwd: .
  # BaseURL: ""
  # Protocol: ""
  # ProviderName: ""
  # APIKey: ""
  # ThinkingLevel: ""
  # NoTools: false
  # NoSkills: false # Skill directory defaults to ~/.agents/skills; override with JARVIS_SKILLS_DIR.
  # WorkspacesRoot: ./workspaces
  # DatabasePath: ./.jarvis/gateway.db
  # APIToken: ""
  # AdminPassword: "" # or set JARVIS_ADMIN_PASSWORD

# Optional GitHub OAuth. Users can also connect a fine-grained PAT from Settings.
GitHub:
  # ClientID: "" # or GITHUB_CLIENT_ID
  # ClientSecret: "" # or GITHUB_CLIENT_SECRET
  # RedirectURL: "https://your-domain.example/v1/github/callback"
  # TokenKey: "" # or GITHUB_TOKEN_KEY; empty generates .jarvis/github-token.key
  # Scopes: "repo read:user"
  # APIBaseURL: "https://api.github.com"
  # WebBaseURL: "https://github.com"
  GitTimeoutSecs: 300

# Public market streams do not require exchange API keys. Override these URLs
# when the deployment network uses an exchange-specific proxy or mirror.
MarketData:
  BinanceWSURL: "wss://data-stream.binance.vision/stream"
  OKXWSURL: "wss://ws.okx.com:8443/ws/v5/public"
  BinanceRESTURL: "https://data-api.binance.vision"
  OKXRESTURL: "https://www.okx.com"
  # Optional US stock sentiment (Reddit / X / Polymarket). Prefer setting
  # SOCIAL_SENTIMENT_API_KEY in the service environment instead of this file.
  # StockSentimentAPIKey: ""
  StockSentimentAPIURL: "https://api.adanos.org"
  StockSentimentCacheTTLSeconds: 86400
  # Cross-market latest news sentiment. Keys may be comma-separated and are
  # preferably supplied through environment variables.
  NewsSentiment:
    CacheTTLSeconds: 1800
    MaxResults: 12
    Anspire:
      # APIKeys: ""
      APIURL: "https://plugin.anspire.cn/api/ntsearch/search"
    Tavily:
      # APIKeys: ""
      APIURL: "https://api.tavily.com/search"
    Bocha:
      # APIKeys: ""
      APIURL: "https://api.bocha.cn/v1/web-search"
    Brave:
      # APIKeys: ""
      APIURL: "https://api.search.brave.com/res/v1/web/search"
