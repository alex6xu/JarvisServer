# JarvisServer 生产配置（替代 etc/gateway.yaml）
# 部署到 VPS 的 /etc/jarvis/gateway.yaml，权限设为 root:jarvis 0640

Name: gateway
Host: 127.0.0.1        # 只监听回环，公网经 Caddy 反代
Port: 8080
Timeout: 0
Mode: pro              # 生产模式（关闭 dev 的宽松 CORS 等）
Log:
  ServiceName: jarvis-gateway
  Mode: file
  Encoding: json
  Path: /var/lib/jarvis/logs
  Level: info
  Rotation: size
  MaxSize: 50
  MaxBackups: 10
  KeepDays: 7
  Compress: true

DistributedLog:
  ServiceName: jarvis-gateway
  Environment: production
  # InstanceID: "" # or set JARVIS_INSTANCE_ID; defaults to hostname-pid

Middlewares:
  Timeout: false       # 关闭默认请求超时，SSE / 长轮询不被截断
  Shedding: false      # Coder 高 CPU 时不丢弃 Chat / Session / Run 恢复请求
  Log: false           # 使用项目结构化日志，避免记录 Authorization / Cookie

Agent:
  Cwd: /var/lib/jarvis
  AuthMode: token      # 生产必须用 Token 认证
  AllowRegistration: false   # 默认关闭匿名自助注册，账号由管理员创建

  # 首次初始化管理员（用户名 dev）。数据库已有账号后改密码无效。
  # 数据库建好后建议从配置移除本项，密码用环境变量 JARVIS_ADMIN_PASSWORD 注入。
  # AdminPassword: ""  # 或设 JARVIS_ADMIN_PASSWORD

  WorkspacesRoot: /var/lib/jarvis/workspaces
  DatabasePath: /var/lib/jarvis/data/gateway.db
  WorkspaceUploadMaxBytes: 104857600
  WorkspaceMaxBytes: 104857600
  WorkspaceMaxFileBytes: 10485760

  AuditRetentionDays: 30
  AuditMaxBodyBytes: 1048576
  RunTimeoutSeconds: 1800

  Approve: false       # 不自动信任副作用工具；无人值守 Coder 需谨慎开启
  NoTools: false
  NoSkills: false

  # 可选启动级兜底 Provider；通常建议启动后在管理界面配置
  # ProviderName: openrouter
  # APIKey: ""
  # BaseURL: ""
  # Protocol: ""

  # 共享管理员 Token，泄露风险大；留空改用账号/API Token
  # APIToken: ""

MarketData:
  BinanceWSURL: "wss://data-stream.binance.vision/stream"
  OKXWSURL: "wss://ws.okx.com:8443/ws/v5/public"
  BinanceRESTURL: "https://data-api.binance.vision"
  OKXRESTURL: "https://www.okx.com"
  # 密钥使用 SOCIAL_SENTIMENT_API_KEY 环境变量注入。
  StockSentimentAPIURL: "https://api.adanos.org"
  StockSentimentCacheTTLSeconds: 86400
  NewsSentiment:
    CacheTTLSeconds: 1800
    MaxResults: 12
    Anspire:
      APIURL: "https://plugin.anspire.cn/api/ntsearch/search"
    Tavily:
      APIURL: "https://api.tavily.com/search"
    Bocha:
      APIURL: "https://api.bocha.cn/v1/web-search"
    Brave:
      APIURL: "https://api.search.brave.com/res/v1/web/search"
